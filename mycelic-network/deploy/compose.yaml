services:
  chat:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_NOSTR_RELAY_URL: ${NEXT_PUBLIC_NOSTR_RELAY_URL:-}
        NEXT_PUBLIC_STUN_URL: ${NEXT_PUBLIC_STUN_URL:-}
    env_file: ../.env.production
    environment:
      MYCELIC_DATA_DIR: /data
    volumes:
      - ledger:/data
    expose:
      - "3000"
    restart: unless-stopped
  proxy:
    image: caddy:2
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env.production}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      chat:
        condition: service_healthy
    restart: unless-stopped
volumes:
  ledger:
  caddy_data:
  caddy_config:
